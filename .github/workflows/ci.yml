name: CI

on:
  push:
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set Build Version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          base_version="${base_tag#v}"
          if [[ -z "$base_version" ]]; then
            base_version="0.0.0"
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${base_version}-pre-$(git rev-parse --short HEAD)"
          fi
          sed -i -E "s/^version: .*/version: ${version}/" pubspec.yaml
          echo "Build version set to ${version}"
      - name: Install dependencies
        run: flutter pub get
      - name: Install xmpp_stone dependencies
        run: dart pub get
        working-directory: vendor/xmpp_stone
      - name: Test xmpp_stone
        run: dart test
        working-directory: vendor/xmpp_stone
      - name: Lint
        run: flutter analyze
      - name: Test
        run: flutter test

  dependency-vulnerability-scan:
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Scan Dependencies For Vulnerabilities
        id: vuln-scan
        uses: anchore/scan-action@v7
        with:
          path: .
          fail-build: false
          severity-cutoff: high
          output-format: sarif
      - name: Upload Vulnerability Report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.vuln-scan.outputs.sarif }}
      - name: Upload Vulnerability SARIF Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-vulnerabilities-sarif
          path: ${{ steps.vuln-scan.outputs.sarif }}
      - name: Print Vulnerability Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sarif="${{ steps.vuln-scan.outputs.sarif }}"
          echo "SARIF: $sarif"
          if [[ ! -f "$sarif" ]]; then
            echo "No SARIF report found."
            exit 1
          fi
          findings="$(jq '.runs[0].results | length' "$sarif")"
          echo "High+ findings: $findings"
          if [[ "$findings" -gt 0 ]]; then
            jq -r '
              .runs[0].results[]
              | "- \(.ruleId): \(.message.text // "No message")"
            ' "$sarif"
          fi
      - name: Enforce Vulnerability Acceptance Policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          sarif_path = Path("${{ steps.vuln-scan.outputs.sarif }}")
          if not sarif_path.exists():
            raise SystemExit("SARIF report missing")

          accept_path = Path(".github/security/vulnerability-acceptances.json")
          if not accept_path.exists():
            raise SystemExit(
              "Acceptance file missing: .github/security/vulnerability-acceptances.json"
            )

          sarif = json.loads(sarif_path.read_text(encoding="utf-8"))
          accepted_doc = json.loads(accept_path.read_text(encoding="utf-8"))

          results = sarif.get("runs", [{}])[0].get("results", [])
          present_ids = {item.get("ruleId") for item in results if item.get("ruleId")}

          accepted_items = accepted_doc.get("accepted", [])
          accepted_ids = set()
          today = date.today()
          errors = []

          for item in accepted_items:
            vuln_id = item.get("id")
            review_by = item.get("review_by")
            if not vuln_id or not review_by:
              errors.append(f"Invalid acceptance entry: {item}")
              continue
            accepted_ids.add(vuln_id)
            try:
              review_date = date.fromisoformat(review_by)
            except ValueError:
              errors.append(f"Invalid review_by date for {vuln_id}: {review_by}")
              continue
            if review_date < today:
              errors.append(
                f"Acceptance expired for {vuln_id}: review_by={review_by}, today={today.isoformat()}"
              )

          stale_acceptances = sorted(accepted_ids - present_ids)
          if stale_acceptances:
            errors.append(
              "Accepted vulnerabilities no longer present (remove from acceptance file): "
              + ", ".join(stale_acceptances)
            )

          unaccepted = sorted(present_ids - accepted_ids)
          if unaccepted:
            errors.append(
              "Unaccepted vulnerabilities found: " + ", ".join(unaccepted)
            )

          if errors:
            print("Dependency vulnerability policy failed:")
            for err in errors:
              print(f"- {err}")
            raise SystemExit(1)

          print("Dependency vulnerability policy passed.")
          PY

  sbom:
    needs: analyze
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-target:
          - linux
          - windows
          - macos
          - ios
          - android
          - web
    steps:
      - uses: actions/checkout@v7
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-${{ matrix.build-target }}.cdx.json
          upload-artifact: false
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ matrix.build-target }}
          path: sbom-${{ matrix.build-target }}.cdx.json

  build-linux:
    needs: analyze
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Add WPE WebKit APT repository
        # WPEWebKit (and its libwpe/WPEBackend-fdo dependencies) are no
        # longer shipped in Ubuntu's own archives (see
        # linux/build-wpewebkit.sh for the full rationale), so pull
        # pre-built packages from our own APT repository instead of
        # compiling them from source on every CI run.
        env:
          WPE_WEBKIT_APT_KEY_URL: ${{ vars.WPE_WEBKIT_APT_KEY_URL || 'https://nexus.cridland.io/repository/public/cridland-nexus-key.asc' }}
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo curl -fsSL -o /etc/apt/keyrings/cridland-nexus.asc "${WPE_WEBKIT_APT_KEY_URL}"
          echo "deb [signed-by=/etc/apt/keyrings/cridland-nexus.asc] https://nexus.cridland.io/repository/wpe-webkit resolute main" \
            | sudo tee /etc/apt/sources.list.d/wpe-webkit.list
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libcurl4-openssl-dev dpkg-dev \
            libwoff2-1 libwoff2-dev \
            libwpe-1.0-1 libwpe-1.0-dev \
            libwpebackend-fdo-1.0-1 libwpebackend-fdo-1.0-dev \
            libwpewebkit-1.0-3 libwpewebkit-1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Set Build Version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          base_version="${base_tag#v}"
          if [[ -z "$base_version" ]]; then
            base_version="0.0.0"
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${base_version}-pre-$(git rev-parse --short HEAD)"
          fi
          sed -i -E "s/^version: .*/version: ${version}/" pubspec.yaml
          echo "Build version set to ${version}"
      - name: Install dependencies
        run: flutter pub get
      - name: Show compiler versions
        run: |
          clang --version || true
          gcc --version || true
          cmake --version || true
      - name: Build Linux
        env:
          CC: clang
          CXX: clang++
        run: flutter build linux --release
      - name: Package Linux
        run: |
          tar -C build/linux/x64/release -czf wimsy-linux.tar.gz bundle
      - name: Package Linux (.deb)
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          PKG_DIR="wimsy_${VERSION}_amd64"
          mkdir -p "$PKG_DIR/DEBIAN" \
                   "$PKG_DIR/usr/lib/wimsy" \
                   "$PKG_DIR/usr/bin" \
                   "$PKG_DIR/usr/share/applications" \
                   "$PKG_DIR/usr/share/icons/hicolor/512x512/apps"
          cp -r build/linux/x64/release/bundle/* "$PKG_DIR/usr/lib/wimsy/"
          install -m 644 web/icons/Icon-512.png "$PKG_DIR/usr/share/icons/hicolor/512x512/apps/wimsy.png"
          cat > "$PKG_DIR/usr/bin/wimsy" <<'EOF'
          #!/bin/sh
          exec /usr/lib/wimsy/wimsy "$@"
          EOF
          chmod 755 "$PKG_DIR/usr/bin/wimsy"
          cat > "$PKG_DIR/usr/share/applications/wimsy.desktop" <<'EOF'
          [Desktop Entry]
          Name=Wimsy
          Exec=/usr/bin/wimsy
          Icon=wimsy
          Type=Application
          Categories=Network;Chat;
          EOF
          cat > "$PKG_DIR/DEBIAN/control" <<EOF
          Package: wimsy
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libsecret-1-0, liblzma5, libwpewebkit-1.0-3, libwpe-1.0-1, libwpebackend-fdo-1.0-1, libwoff2-1
          Maintainer: Wimsy
          Description: Wimsy XMPP client
          EOF
          dpkg-deb --build "$PKG_DIR"
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: wimsy-linux
          path: wimsy-linux.tar.gz
      - name: Upload Linux .deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: wimsy-linux-deb
          path: wimsy_*.deb

  build-windows:
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable Developer Mode (required for symlink extraction by flutter_webrtc CMake)
        shell: powershell
        run: |
          # flutter_webrtc's CMake downloads libwebrtc.zip and extracts it
          # through a path that contains a Flutter plugin symlink/junction.
          # Without Developer Mode the Windows kernel blocks symlink creation
          # and CMake's archive_write_header fails.  Enabling Developer Mode
          # grants SeCreateSymbolicLinkPrivilege to the current process.
          $regPath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          if (-not (Test-Path $regPath)) {
            New-Item -Path $regPath -Force | Out-Null
          }
          Set-ItemProperty -Path $regPath -Name AllowDevelopmentWithoutDevLicense -Value 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Set Build Version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          base_version="${base_tag#v}"
          if [[ -z "$base_version" ]]; then
            base_version="0.0.0"
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${base_version}-pre-$(git rev-parse --short HEAD)"
          fi
          sed -i -E "s/^version: .*/version: ${version}/" pubspec.yaml
          echo "Build version set to ${version}"
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Package Windows (MSIX)
        run: dart run msix:create
      - name: Package Windows
        run: |
          powershell -Command "Compress-Archive -Path build\\windows\\x64\\runner\\Release\\* -DestinationPath wimsy-windows.zip"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: wimsy-windows
          path: wimsy-windows.zip
      - name: Upload Windows MSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: wimsy-windows-msix
          path: build/windows/x64/runner/Release/*.msix

  build-macos:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Set Build Version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          base_version="${base_tag#v}"
          if [[ -z "$base_version" ]]; then
            base_version="0.0.0"
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${base_version}-pre-$(git rev-parse --short HEAD)"
          fi
          sed -i -E "s/^version: .*/version: ${version}/" pubspec.yaml
          echo "Build version set to ${version}"
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Package macOS
        run: |
          tar -C build/macos/Build/Products -czf wimsy-macos.tar.gz Release
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: wimsy-macos
          path: wimsy-macos.tar.gz

  build-ios:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Set Build Version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          base_version="${base_tag#v}"
          if [[ -z "$base_version" ]]; then
            base_version="0.0.0"
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${base_version}-pre-$(git rev-parse --short HEAD)"
          fi
          sed -i -E "s/^version: .*/version: ${version}/" pubspec.yaml
          echo "Build version set to ${version}"
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS
        run: flutter build ios --no-codesign
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: wimsy-ios
          path: build/ios/iphoneos

  build-android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Set Build Version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          base_version="${base_tag#v}"
          if [[ -z "$base_version" ]]; then
            base_version="0.0.0"
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${base_version}-pre-$(git rev-parse --short HEAD)"
          fi
          sed -i -E "s/^version: .*/version: ${version}/" pubspec.yaml
          echo "Build version set to ${version}"
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android (release)
        run: flutter build apk --release
      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: wimsy-android
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Build Android (debug)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build apk --debug
      - name: Upload Android debug artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: wimsy-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  build-web:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set Build Version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          base_version="${base_tag#v}"
          if [[ -z "$base_version" ]]; then
            base_version="0.0.0"
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${base_version}-pre-$(git rev-parse --short HEAD)"
          fi
          sed -i -E "s/^version: .*/version: ${version}/" pubspec.yaml
          echo "Build version set to ${version}"
      - name: Install dependencies
        run: flutter pub get
      - name: Test WebTransport in Chrome
        run: flutter test --platform chrome test/webtransport_browser_test.dart
      - name: Build Web
        run: tool/build_web.sh
      - name: Package Web
        run: |
          tar -C build -czf wimsy-web.tar.gz web
      - name: Upload Web artifact
        uses: actions/upload-artifact@v6
        with:
          name: wimsy-web
          path: wimsy-web.tar.gz

  deploy-web:
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Web (GitHub Pages)
        run: tool/build_web.sh --base-href "/${{ github.event.repository.name }}/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    needs: [build-linux, build-windows, build-macos, build-android, build-web, sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List release assets
        run: ls -la dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wimsy-linux/wimsy-linux.tar.gz
            dist/wimsy-linux-deb/wimsy_*.deb
            dist/wimsy-windows/wimsy-windows.zip
            dist/wimsy-windows-msix/*.msix
            dist/wimsy-macos/wimsy-macos.tar.gz
            dist/wimsy-android/app-release.apk
            dist/wimsy-web/wimsy-web.tar.gz
            dist/sbom-linux/sbom-linux.cdx.json
            dist/sbom-windows/sbom-windows.cdx.json
            dist/sbom-macos/sbom-macos.cdx.json
            dist/sbom-ios/sbom-ios.cdx.json
            dist/sbom-android/sbom-android.cdx.json
            dist/sbom-web/sbom-web.cdx.json
