[package]
name = "flutter_quic"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
quinn = "0.11.8"
quinn-proto = "0.11.12"
tokio = { version = "1.0", features = ["full"] }
rustls = { version = "0.23.5", default-features = false, features = ["ring"] }
rustls-pki-types = "1.0"
thiserror = "2.0"
bytes = "1.8"
futures = "0.3"
tracing = "0.1"
chrono = "0.4"
url = "2.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Local vendored forks of quinn and quinn-proto 0.11.x, patched to expose the
# peer's advertised `initial_max_streams_bidi` (and friends) via new public
# accessors on `Connection`. Upstream quinn 0.11 does not expose peer transport
# parameters, which makes diagnosing bidi-stream credit starvation (an
# `open_bi()` that blocks forever because the peer advertised a small
# `initial_max_streams_bidi` and never sends `MAX_STREAMS`) essentially
# impossible from the application side. See:
#   vendor/quinn-proto/src/connection/mod.rs  -> peer_params_initial_max_streams_bidi
#   vendor/quinn/src/connection.rs            -> peer_params_initial_max_streams_bidi
[patch.crates-io]
quinn = { path = "vendor/quinn" }
quinn-proto = { path = "vendor/quinn-proto" }
