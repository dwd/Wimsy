# Brings up a single-node Openfire server in a known, reproducible state for
# Maestro end-to-end tests against Wimsy. See maestro/README.md for usage.
#
# The "openfire-seed" service initializes the data volume's conf/ directory
# once, before Openfire's own entrypoint runs, then overlays our openfire.xml
# (which contains an <autosetup/> block, see that file for details) and
# security.xml on top. Openfire deletes the <autosetup/> block after it
# completes setup, so the seed step is skipped on subsequent starts unless
# the volume is removed (`docker compose down -v`).
#
# The seed step uses the same Openfire image (rather than a generic image
# like alpine) specifically so it has access to the image's own
# resources/security_org/ (default keystore/truststore), conf_org/ (default
# conf/ templates), and plugins_org/ (bundled plugins, e.g. Spiffing):
# Openfire's /sbin/entrypoint.sh only populates conf/ and plugins/ (copying
# conf_org/, resources/security_org/, and plugins_org/ into the volume) the
# very first time conf/ doesn't exist yet. Since this seed step always
# creates conf/ itself, the main "openfire" service's own entrypoint would
# otherwise find conf/ "already exists" and skip all of those copies - not
# just leaving Openfire with no keystore/truststore (breaking TLS and the
# HTTP bind connector), but also silently starting with none of the
# bundled plugins loaded at all. So this step does that copying itself.
#
# A dedicated .wimsy-seeded marker (rather than checking whether conf/ or
# our files already exist) tracks whether *we* have run, since conf_org
# already ships its own default openfire.xml/security.xml, which would
# otherwise make an existence check on those filenames false right after
# the conf_org copy above and skip overlaying our custom versions.
services:
  openfire-seed:
    image: docker.cridland.io/openfire:dwd-deploy
    volumes:
      - ./openfire:/seed:ro
      - openfire-data:/var/lib/openfire
    entrypoint: >
      sh -c "
        if [ -f /var/lib/openfire/.wimsy-seeded ]; then
          echo 'Data volume already seeded; leaving existing server state untouched.';
        else
          if [ ! -d /var/lib/openfire/conf ]; then
            cp -a /usr/local/openfire/conf_org /var/lib/openfire/conf &&
            cp -a /usr/local/openfire/resources/security_org /var/lib/openfire/conf/security;
          fi &&
          if [ ! -d /var/lib/openfire/plugins ]; then
            cp -a /usr/local/openfire/plugins_org /var/lib/openfire/plugins;
          fi &&
          cp /seed/security.xml /var/lib/openfire/conf/security.xml &&
          cp /seed/openfire.xml /var/lib/openfire/conf/openfire.xml &&
          touch /var/lib/openfire/.wimsy-seeded &&
          echo 'Seeded fresh Openfire config into the data volume.';
        fi
      "

  openfire:
    image: docker.cridland.io/openfire:dwd-deploy
    depends_on:
      openfire-seed:
        condition: service_completed_successfully
    environment:
      # Tells the Spiffing plugin (already bundled in this image) to load
      # spiffing-policy.xml below as the server's default security-label
      # policy on startup, whenever none is configured yet - see
      # SpiffingProperties.getBootstrapPolicyFile() in
      # ~/src/openfire-spiffing-plugin for the resolution order. A JVM
      # system property (rather than, say, an <autosetup/> entry in
      # openfire.xml) is used because it needs to be readable during the
      # plugin's very first startup, before Openfire's database-backed
      # property store is necessarily populated.
      OPENFIRE_OPTS: "-Dspiffing.bootstrapPolicyFile=/seed/spiffing-policy.xml"
    ports:
      # The client-facing ports are published on dedicated 15222-15224 host
      # ports (rather than Openfire's conventional 5222-5224) to avoid
      # colliding with unrelated local services/containers that may already
      # be bound to those well-known ports; the container-side ports (and
      # thus openfire.xml's configuration) are unaffected.
      - "15222:5222" # Client-to-server (c2s), StartTLS
      - "15223:5223" # Client-to-server (c2s), Direct TLS (XEP-0368)
      - "15224:5224/udp" # Client-to-server (c2s), QUIC (XEP-0467)
      - "5269:5269" # Server-to-server (s2s)
      - "7070:7070" # BOSH / HTTP binding
      - "7443:7443" # Admin console (HTTPS)
      - "9090:9090" # Admin console (HTTP)
    volumes:
      # spiffing-policy.xml (mounted as /seed/spiffing-policy.xml, see
      # OPENFIRE_OPTS above) is the only thing from ./openfire this service
      # itself needs; the rest (openfire.xml, security.xml) is only read by
      # the one-shot openfire-seed service above.
      - ./openfire:/seed:ro
      - openfire-data:/var/lib/openfire
    healthcheck:
      # The dwd-deploy image doesn't ship wget/curl, so probe the admin
      # console port directly using bash's /dev/tcp pseudo-device instead.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9090' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  openfire-data:
