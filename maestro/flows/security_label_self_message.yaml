# Logs in as "alice", opens a self-chat with "alice@localhost" (already in
# her own roster thanks to maestro/openfire/openfire.xml), and verifies
# XEP-0258 security-label display markings are shown correctly: first that
# the server's configured *default* label is applied automatically to a
# message that doesn't explicitly set one, then that explicitly picking a
# different classification is also reflected correctly.
#
# This needs a security-label *policy* (SPIF) to be configured server-side,
# which the test Openfire container now bootstraps automatically on a fresh
# install - see maestro/openfire/spiffing-policy.xml (the policy document
# itself) and maestro/docker-compose.yml's "openfire" service
# (OPENFIRE_OPTS, which points the Spiffing plugin at it) for how. It is
# therefore part of the normal CI job, unlike when this flow was first
# written (see maestro/README.md's "Running in CI" section for the current
# list of flows run there).
#
# Requires, before running `maestro test`:
#   - The Openfire container is up and healthy (see maestro/README.md).
#   - `adb reverse tcp:15222 tcp:15222` has been run so that
#     "localhost:15222" inside the emulator reaches the Openfire container's
#     StartTLS port published on the host.
appId: im.cridland.wimsy
---
- launchApp:
    clearState: true
# A fresh install with clearState always lands on the one-time "Set a PIN"
# screen before the login screen; skip it since we don't need a PIN for
# these tests.
- extendedWaitUntil:
    visible:
      id: "pin-setup-continue-without-pin-button"
    timeout: 45000
- tapOn:
    id: "pin-setup-continue-without-pin-button"
- tapOn:
    id: "login-jid-field"
- inputText: "alice@localhost"
- tapOn:
    id: "login-password-field"
- inputText: "alice123"
- tapOn:
    id: "manual-connection-toggle"
- tapOn:
    id: "login-host-field"
- inputText: "localhost"
- tapOn:
    id: "login-port-field"
# The port field already defaults to "5222", so it must be cleared first or
# inputText would append to it (producing the invalid port "522215222").
# docker-compose.yml publishes StartTLS on host port 15222 (instead of the
# conventional 5222) to avoid colliding with unrelated local services.
- eraseText
- inputText: "15222"
- hideKeyboard
# Launching the app can trigger Android's "Allow Wimsy to send you
# notifications?" permission dialog with some delay; dismiss it here if it
# appears, since it would otherwise cover the Connect button.
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    id: "login-connect-button"
# StartTLS presents Openfire's self-signed test certificate, which fails
# standard CA validation and triggers the "Untrusted certificate" dialog
# (see login_screen.dart's _showCertificateTrustDialog); click through it by
# trusting the certificate so the connection can proceed.
- tapOn:
    id: "certificate-trust-trust-button"
    optional: true
# assertVisible's built-in fluent retry only waits ~7s, which is not always
# long enough for Openfire to finish the handshake, so extendedWaitUntil is
# used here to allow a longer, explicit timeout (timeout is not a valid
# assertVisible property).
- extendedWaitUntil:
    visible:
      text: "Signed in as alice@localhost"
    timeout: 40000
# The roster populates asynchronously right after sign-in. Alice's
# self-roster item (seeded in maestro/openfire/openfire.xml) is shown under
# its configured nickname ("Alice"), not the raw JID, and its name and
# presence status are merged into a single accessibility node (e.g.
# "Alice\nOnline"), hence "(?s)" (so "." also matches the newline) rather
# than matching on just the nickname substring.
- extendedWaitUntil:
    visible:
      text: "(?s)Alice.*"
    timeout: 45000
- tapOn: "(?s)Alice.*"
# First, send a message *without* touching "Add security label" at all. The
# server's active policy (maestro/openfire/spiffing-policy.xml) has a
# default label configured for its lowest classification ("PUBLIC"), which
# the client is expected to apply automatically to outgoing messages that
# don't otherwise specify one - so even this "unlabelled" message should
# still show a marking chip for it.
- tapOn:
    id: "message-composer-input"
- inputText: "Hello, default label"
- tapOn:
    id: "message-send-button"
- assertVisible: "Hello, default label"
# The marking chip's text is merged, together with the sender name and
# timestamp, into a single accessibility node (e.g. "You\n16:40\nWimsy
# PUBLIC"), and Maestro's text selector requires a full match against that
# whole node, hence "(?s)" (so "." also matches the newlines) rather than
# matching the marking text alone.
- assertVisible: "(?s)You.*Wimsy PUBLIC"
# Now explicitly apply a label with a *different* classification via the
# composer's "Add security label" button, to confirm an explicit choice is
# also reflected correctly (not just the default). The active policy has no
# label catalogue entries pre-defined, so the picker falls through to
# "Create new label..." for building one from the policy's classifications
# directly.
- tapOn:
    text: "Add security label"
- tapOn: "Create new label…"
- tapOn: "INTERNAL"
- tapOn: "Apply"
- tapOn:
    id: "message-composer-input"
- inputText: "Hello, explicit label"
- tapOn:
    id: "message-send-button"
- assertVisible: "Hello, explicit label"
# Per XEP-0258, a <displaymarking/> with no language specified should fall
# back to the policy's plain classification name (here, "INTERNAL"), not a
# translated marking phrase. If this assertion fails, the display-marking
# language fallback is regressed; do not weaken it to match whatever
# currently renders. See the note above about the marking chip's text being
# merged into a single "You\n<time>\n<marking>" accessibility node.
- assertVisible: "(?s)You.*Wimsy INTERNAL"
