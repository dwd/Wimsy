# Logs in as "alice", opens a self-chat with "alice@localhost" (already in
# her own roster thanks to maestro/openfire/openfire.xml), applies a
# security label (XEP-0258) and sends a message to herself, then verifies
# the label's display marking is shown correctly on the resulting message.
#
# Unlike send_message.yaml, this flow needs a security-label *policy* (SPIF)
# to be configured server-side, which the Spiffing plugin does not ship with
# a default for. It is therefore not part of the CI job (see
# maestro/README.md's "Running in CI" section) and is intended to be run
# manually against a dev Openfire instance that already has the Spiffing
# plugin's NATO/4774 test policy uploaded and configured as the active
# policy for alice@localhost (Server Settings -> Spiffing). See
# ~/src/spiffing/ for the test policy and ~/src/openfire-spiffing-plugin/
# for the plugin itself.
#
# Requires, before running `maestro test`:
#   - The Openfire container is up and healthy, with the Spiffing plugin's
#     NATO policy configured as above (see maestro/README.md).
#   - `adb reverse tcp:15222 tcp:15222` has been run so that
#     "localhost:15222" inside the emulator reaches the Openfire container's
#     StartTLS port published on the host.
appId: im.cridland.wimsy
---
- launchApp:
    clearState: true
# A fresh install with clearState always lands on the one-time "Set a PIN"
# screen before the login screen; skip it since we don't need a PIN for
# these tests.
- tapOn:
    id: "pin-setup-continue-without-pin-button"
- tapOn:
    id: "login-jid-field"
- inputText: "alice@localhost"
- tapOn:
    id: "login-password-field"
- inputText: "alice123"
- tapOn:
    id: "manual-connection-toggle"
- tapOn:
    id: "login-host-field"
- inputText: "localhost"
- tapOn:
    id: "login-port-field"
# The port field already defaults to "5222", so it must be cleared first or
# inputText would append to it (producing the invalid port "522215222").
# docker-compose.yml publishes StartTLS on host port 15222 (instead of the
# conventional 5222) to avoid colliding with unrelated local services.
- eraseText
- inputText: "15222"
- hideKeyboard
# Launching the app can trigger Android's "Allow Wimsy to send you
# notifications?" permission dialog with some delay; dismiss it here if it
# appears, since it would otherwise cover the Connect button.
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    id: "login-connect-button"
# StartTLS presents Openfire's self-signed test certificate, which fails
# standard CA validation and triggers the "Untrusted certificate" dialog
# (see login_screen.dart's _showCertificateTrustDialog); click through it by
# trusting the certificate so the connection can proceed.
- tapOn:
    id: "certificate-trust-trust-button"
    optional: true
# assertVisible's built-in fluent retry only waits ~7s, which is not always
# long enough for Openfire to finish the handshake, so extendedWaitUntil is
# used here to allow a longer, explicit timeout (timeout is not a valid
# assertVisible property).
- extendedWaitUntil:
    visible:
      text: "Signed in as alice@localhost"
    timeout: 20000
# The roster populates asynchronously right after sign-in. The contact's
# name and presence status are merged into a single accessibility node
# (e.g. "alice@localhost\nOnline"), and Maestro's text selector requires a
# full match against that whole node, not just a substring, hence "(?s)"
# (so "." also matches the newline) rather than matching the bare JID.
- extendedWaitUntil:
    visible:
      text: "(?s)alice@localhost.*"
    timeout: 30000
- tapOn: "(?s)alice@localhost.*"
# First, send one message with no security label, to confirm the self-chat
# path works on its own and that an unlabelled message shows no marking
# chip at all.
- tapOn:
    id: "message-composer-input"
- inputText: "Hello, unlabelled"
- tapOn:
    id: "message-send-button"
- assertVisible: "Hello, unlabelled"
- assertNotVisible: "NATO"
# Now apply a security label via the composer's "Add security label"
# button. The active policy has no label catalogue entries pre-defined, so
# the picker falls through to "Create new label..." for building one from
# the policy's classifications directly.
- tapOn:
    text: "Add security label"
- tapOn: "Create new label…"
# Pick the policy's lowest (default) classification. Its display text here
# may be rendered in whichever language the policy's markingData happens to
# carry for that classification (this is the open multilingual-marking
# question this flow is meant to help pin down), so match on either the
# English classification name or the French marking phrase actually defined
# for it in the NATO/4774 test policy.
- tapOn: "(?s)(UNCLASSIFIED|SANS CLASSIFICATION)"
- tapOn: "Apply"
- tapOn:
    id: "message-composer-input"
- inputText: "Hello, labelled"
- tapOn:
    id: "message-send-button"
- assertVisible: "Hello, labelled"
# Per XEP-0258, a <displaymarking/> with no language specified should fall
# back to the policy's plain classification name (here, "UNCLASSIFIED"),
# not a translated marking phrase - confirmed directly against the
# `spiffing` package's own displayMarking('') behaviour for this policy.
# If this assertion fails, the display-marking language fallback is
# regressed; do not weaken it to match whatever currently renders.
- assertVisible: "NATO UNCLASSIFIED"
