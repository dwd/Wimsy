# Serve the contents of build/web at /var/www/wimsy.
server {
    listen 80;
    server_name wimsy.example.com;
    root /var/www/wimsy;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # These files select the current build and must be revalidated.
    location ~ ^/(?:index\.html|flutter(?:_bootstrap|_service_worker)?\.js|main\.dart\.js|update\.json|version\.json|manifest\.json|AssetManifest.*|FontManifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # Renderer resources are stable for a Flutter engine revision.
    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?|wasm)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }
}
