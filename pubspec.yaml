name: wimsy
description: "A cross-platform XMPP client."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.0.2

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  sentry_flutter: ^10.2.0
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  xmpp_stone:
    path: vendor/xmpp_stone
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Used to locate the Hive box file so its size can be monitored.
  path_provider: ^2.1.4
  flutter_secure_storage: ^10.0.0
  cryptography: ^2.7.0
  # Used to compute SHA-256 certificate fingerprints for the TLS
  # trust-on-first-use flow (see lib/xmpp/certificate_trust.dart).
  crypto: ^3.0.8
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.3
  flutter_foreground_task: ^11.0.3
  connectivity_plus: ^7.3.1
  file_picker: ^11.0.2
  image_picker: ^1.2.4
  flutter_webrtc: ^1.6.3
  permission_handler: ^12.0.1
  http: ^1.6.0
  universal_io: ^2.3.1
  web: ^1.1.2
  qr_flutter: ^4.1.0
  flutter_quic:
    path: vendor/flutter_quic
  # XEP-0258: parses/renders security labels against a Security Policy
  # Information File (SPIF). Now pinned to a specific commit on its
  # public GitHub repository rather than a local path dependency.
  spiffing:
    git:
      url: https://github.com/dwd/spiffing-dart.git
      ref: a883226
  # XEP-0258: Flutter widgets (label editor/picker) for the `spiffing`
  # SPIF/Label/Clearance model above. Now pinned to a specific commit on
  # its public GitHub repository rather than a local path dependency.
  flutter_spiffing:
    git:
      url: https://github.com/dwd/flutter_spiffing.git
      ref: ab107a98633c86d5b230aac562dd29a465cf8f1
  # Used directly (not just transitively via spiffing/xmpp_stone) to
  # round-trip a persisted/staged XEP-0258 <securitylabel/> element
  # between its XML text form and an XmppElement tree.
  xml: ^7.1.0
  # XEP-0491: hosts WebXDC (webxdc.org) mini-app widgets shared in chats.
  # Pinned to a specific commit on its public GitHub repository (the
  # federated platform packages - flutter_webxdc_platform_interface,
  # flutter_webxdc_memory, flutter_webxdc_web, flutter_webxdc_webview,
  # flutter_webxdc_linux - are resolved transitively as path dependencies
  # within the same git checkout).
  # NOTE: ref bumped to 9935b7c to pick up the flutter_webxdc_web fix that
  # neutralizes an app's conventional <script src="webxdc.js"> reference
  # instead of leaving it untouched - previously that tag resolved against
  # the real hosting page's origin inside the sandboxed srcdoc iframe and
  # tried to fetch over the network, which the injected CSP correctly
  # blocked, surfacing as WebXDC mini-apps silently failing to load in the
  # web build.
  flutter_webxdc:
    git:
      url: https://github.com/dwd/flutter_webxdc.git
      ref: 9935b7c

dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  msix: ^3.16.8
  fake_async: ^1.3.2
  flutter_test:
    sdk: flutter
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

dependency_overrides:
  flutter_rust_bridge: 2.11.1
  # The published flutter_inappwebview_forge_linux 1.0.8 release on pub.dev
  # fails to build against the system WPE WebKit dev packages (stale
  # post-fork PLUGIN_NAME/header directory, calls to nonexistent WPE
  # WebKit API, a variable-name typo - see bug-report.md previously filed
  # for this package). flutter_webxdc_linux itself overrides this
  # dependency to its own vendored/fixed copy, but dependency_overrides in
  # a non-root package are ignored by pub, so the override must be
  # repeated here in Wimsy's own pubspec.yaml, pointing at the same fixed
  # copy vendored inside the flutter_webxdc repository (kept in lockstep
  # with the flutter_webxdc git ref above).
  flutter_inappwebview_forge_linux:
    git:
      url: https://github.com/dwd/flutter_webxdc.git
      ref: 9935b7c
      path: flutter_inappwebview_forge_linux
  # The published flutter_inappwebview_forge_windows 1.0.15 release on
  # pub.dev is a stale post-fork copy whose windows/CMakeLists.txt still
  # names its CMake library target "flutter_inappwebview_windows_plugin"
  # (and its bundled-libraries variable
  # "flutter_inappwebview_windows_bundled_libraries") instead of the
  # package-name-derived "flutter_inappwebview_forge_windows_plugin" /
  # "flutter_inappwebview_forge_windows_bundled_libraries" that Flutter's
  # generated windows/flutter/generated_plugins.cmake looks up for a
  # plugin named flutter_inappwebview_forge_windows. That mismatch makes
  # `flutter build windows` fail with "No target
  # flutter_inappwebview_forge_windows_plugin" while evaluating
  # $<TARGET_FILE:...>, after a preceding (harmless) CMP0175 dev warning
  # about the plugin's NuGet-restore add_custom_command. Vendor a locally
  # patched copy (CMakeLists.txt target/variable names corrected) rather
  # than waiting on an upstream release, mirroring the Linux override
  # above for the same class of fork rename bug.
  flutter_inappwebview_forge_windows:
    path: vendor/flutter_inappwebview_forge_windows
  # The published flutter_inappwebview_forge_macos 1.1.10 release on
  # pub.dev fails to build on macOS with several genuine Swift compile
  # errors:
  #  - InAppWebView.swift assigns an NSDirectionalEdgeInsets value to the
  #    obscuredContentInsets property, whose type on macOS is actually
  #    NSEdgeInsets (unlike the iOS/UIKit equivalent).
  #  - InAppWebViewSettings.swift reads the .leading/.trailing members of
  #    that same NSEdgeInsets value, which only has .left/.right.
  #  - InAppWebViewFlutterPlugin.swift declares the containerManager
  #    property with the concrete (but macOS 14.0-only) ContainerManager
  #    type, instead of Any? like the other macOS-14-gated managers.
  #  - MyCookieManager.swift references its internal static
  #    httpCookieStore property as a default argument value in several
  #    public static functions, which Swift disallows.
  # Vendor a locally patched copy (all four issues fixed) rather than
  # waiting on an upstream release, mirroring the Linux and Windows
  # overrides above for the same plugin family.
  flutter_inappwebview_forge_macos:
    path: vendor/flutter_inappwebview_forge_macos

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

msix_config:
  display_name: Wimsy
  publisher: CN=Extensible Messaging Ltd, O=Extensible Messaging Ltd, C=GB
  publisher_display_name: Extensible Messaging Ltd
  identity_name: Wimsy
  msix_version: 0.0.2.0
  logo_path: web/icons/Icon-512.png
  capabilities: internetClient
  sign_msix: false

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: wimsy
  org: cridland-conspiracy
